<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Meeting Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e8f0fe 0%, #f5f7fa 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            color: #1a2332;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: #4f8cff;
        }

        .badge {
            background: #1a2332;
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge i {
            color: #4f8cff;
        }

        .warning-banner {
            display: none;
            align-items: center;
            gap: 10px;
            background: #fffbeb;
            border: 1px solid #f6d675;
            color: #92600a;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .warning-banner.show {
            display: flex;
        }

        .status-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px 25px;
            background: #f8fafc;
            padding: 14px 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid #e9edf2;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #2d3748;
        }

        .status-item i {
            color: #4f8cff;
            width: 18px;
        }

        .status-item .count {
            background: #e9edf2;
            padding: 0 12px;
            border-radius: 30px;
            font-weight: 700;
            color: #1a2332;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 9px 20px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #4f8cff;
            color: white;
            box-shadow: 0 4px 12px rgba(79, 140, 255, 0.3);
        }

        .btn-primary:hover {
            background: #3a7ae8;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 140, 255, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: transparent;
            color: #2d3748;
            border: 1px solid #d1d8e0;
        }

        .btn-outline:hover {
            background: #f1f4f8;
            border-color: #b0bcc9;
        }

        .btn-success {
            background: #38a169;
            color: white;
        }

        .btn-success:hover {
            background: #2f855a;
        }

        .btn-danger {
            background: #e53e3e;
            color: white;
        }

        .btn-danger:hover {
            background: #c53030;
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e9edf2;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 500px;
        }

        th {
            background: #f8fafc;
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: #2d3748;
            border-bottom: 2px solid #e9edf2;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f4f8;
            color: #2d3748;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #fafcff;
        }

        .teacher-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e9edf2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #2d3748;
            font-size: 14px;
            flex-shrink: 0;
        }

        .status-badge {
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .status-badge.present {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-badge.absent {
            background: #fed7d7;
            color: #9b2c2c;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
        }

        .action-btns button {
            background: none;
            border: none;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            color: #718096;
            transition: all 0.2s;
            font-size: 14px;
        }

        .action-btns button:hover {
            background: #f1f4f8;
            color: #2d3748;
        }

        .action-btns .delete-btn:hover {
            background: #fed7d7;
            color: #9b2c2c;
        }

        .confirm-row {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex: 1;
        }

        .input-group input {
            padding: 10px 16px;
            border: 1px solid #d1d8e0;
            border-radius: 50px;
            font-size: 14px;
            flex: 1;
            min-width: 140px;
            transition: all 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4f8cff;
            box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.1);
        }

        .footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #718096;
        }

        .empty-state i {
            font-size: 40px;
            color: #cbd5e0;
            margin-bottom: 12px;
            display: block;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 24px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            max-width: 400px;
            animation: slideIn 0.3s ease;
        }

        .toast.show {
            display: flex;
        }

        .toast.success {
            background: #38a169;
        }

        .toast.error {
            background: #e53e3e;
        }

        .toast.info {
            background: #3182ce;
        }

        @keyframes slideIn {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .spinner {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            .header h1 {
                font-size: 22px;
            }

            .status-bar {
                flex-direction: column;
                gap: 8px;
            }

            .footer {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group input {
                min-width: 100px;
            }

            .controls {
                width: 100%;
            }

            .controls .btn {
                flex: 1;
                justify-content: center;
            }

            .toast {
                bottom: 20px;
                right: 20px;
                left: 20px;
                max-width: none;
            }
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .badge {
                justify-content: center;
            }

            .input-group {
                flex-direction: column;
            }

            .input-group input {
                width: 100%;
            }

            .input-group .btn {
                width: 100%;
                justify-content: center;
            }

            table {
                font-size: 13px;
                min-width: 400px;
            }

            th, td {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-chalkboard-teacher"></i>
                Meeting Tracker
            </h1>
            <div class="badge">
                <i class="fas fa-database"></i>
                <span id="modeDisplay">Local storage</span>
            </div>
        </div>

        <!-- Warning banner (shown only if persistent storage isn't available) -->
        <div class="warning-banner" id="warningBanner">
            <i class="fas fa-triangle-exclamation"></i>
            <span id="warningText">Running without persistent storage — your changes will be lost on refresh.</span>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <i class="fas fa-users"></i>
                Total Teachers: <span class="count" id="totalCount">0</span>
            </div>
            <div class="status-item">
                <i class="fas fa-video"></i>
                Present: <span class="count" id="presentCount">0</span>
            </div>
            <div class="status-item">
                <i class="fas fa-clock"></i>
                Last Updated: <span id="lastUpdated">Just now</span>
            </div>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Teacher</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th style="text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="teacherTableBody">
                    <tr>
                        <td colspan="4" class="empty-state">
                            <i class="fas fa-users-slash"></i>
                            No teachers added yet
                            <br>
                            <span style="font-size: 13px; color: #a0aec0;">Add your first teacher below</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="input-group">
                <input type="text" id="nameInput" placeholder="Full name *" autocomplete="off">
                <input type="email" id="emailInput" placeholder="Email (optional)" autocomplete="off">
                <button class="btn btn-primary" id="addBtn" type="button">
                    <i class="fas fa-plus-circle"></i>
                    <span id="addBtnText">Add Teacher</span>
                </button>
            </div>
            <div class="controls">
                <button class="btn btn-success" id="markAllBtn" type="button">
                    <i class="fas fa-check-double"></i>
                    All Present
                </button>
                <button class="btn btn-outline" id="refreshBtn" type="button">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i id="toastIcon" class="fas fa-check-circle"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <script>
        // ============================================================
        //  STATE
        // ============================================================
        let teachers = [];
        let storageAvailable = false;
        let pendingDeleteIndex = null;
        const STORAGE_KEY = 'teacherData';

        // ============================================================
        //  DOM ELEMENTS
        // ============================================================
        const tbody = document.getElementById('teacherTableBody');
        const totalCount = document.getElementById('totalCount');
        const presentCount = document.getElementById('presentCount');
        const lastUpdated = document.getElementById('lastUpdated');
        const modeDisplay = document.getElementById('modeDisplay');
        const warningBanner = document.getElementById('warningBanner');
        const warningText = document.getElementById('warningText');
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const addBtn = document.getElementById('addBtn');
        const addBtnText = document.getElementById('addBtnText');
        const markAllBtn = document.getElementById('markAllBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const toast = document.getElementById('toast');
        const toastIcon = document.getElementById('toastIcon');
        const toastMessage = document.getElementById('toastMessage');

        // ============================================================
        //  VISIBLE ERROR SURFACING
        //  Any uncaught error shows up as a toast instead of failing
        //  silently in the console, so problems are easy to spot.
        // ============================================================
        window.addEventListener('error', function(e) {
            showToast('⚠️ Script error: ' + (e.message || 'see console'), 'error');
        });

        // ============================================================
        //  TOAST SYSTEM
        // ============================================================
        let toastTimeout = null;

        function showToast(message, type) {
            type = type || 'success';
            toast.className = 'toast';
            toast.classList.add(type);
            toastMessage.textContent = message;

            if (type === 'success') {
                toastIcon.className = 'fas fa-check-circle';
            } else if (type === 'error') {
                toastIcon.className = 'fas fa-exclamation-circle';
            } else {
                toastIcon.className = 'fas fa-info-circle';
            }

            toast.classList.add('show');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(function() {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        //  HELPERS
        // ============================================================
        function getInitials(name) {
            if (!name) return '?';
            return name.charAt(0).toUpperCase();
        }

        function formatTime() {
            const now = new Date();
            return now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function updateStatusBar() {
            const total = teachers.length;
            const present = teachers.filter(function(t) { return t.status === 'present'; }).length;
            totalCount.textContent = total;
            presentCount.textContent = present;
            lastUpdated.textContent = formatTime();
        }

        function validateEmail(email) {
            if (!email) return true;
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function generateId() {
            return Date.now() + Math.floor(Math.random() * 1000);
        }

        // ============================================================
        //  PERSISTENT STORAGE
        //  Uses the artifact's window.storage bridge. If it isn't
        //  present (e.g. this file opened outside Claude.ai), the app
        //  still works for the session, just without persistence, and
        //  a visible banner says so instead of failing silently.
        // ============================================================
        function detectStorage() {
            storageAvailable = (typeof window.storage !== 'undefined'
                && window.storage !== null
                && typeof window.storage.get === 'function');

            if (!storageAvailable) {
                modeDisplay.textContent = 'In-memory only';
                warningText.textContent = 'Persistent storage isn\'t available here — your changes will be lost on refresh.';
                warningBanner.classList.add('show');
            } else {
                modeDisplay.textContent = 'Saved automatically';
                warningBanner.classList.remove('show');
            }
        }

        async function saveTeachers() {
            if (!storageAvailable) return;
            try {
                await window.storage.set(STORAGE_KEY, JSON.stringify(teachers), false);
            } catch (e) {
                console.warn('Save failed:', e);
                showToast('⚠️ Could not save — changes may not persist', 'error');
            }
        }

        async function loadTeachers() {
            if (!storageAvailable) return false;
            try {
                const result = await window.storage.get(STORAGE_KEY, false);
                if (result && result.value) {
                    teachers = JSON.parse(result.value);
                    return true;
                }
            } catch (e) {
                // Expected on first run (no key saved yet)
            }
            return false;
        }

        function seedSampleData() {
            teachers = [
                { id: 1, name: 'Dr. Sarah Chen', email: 'sarah@edu.org', status: 'present' },
                { id: 2, name: 'Prof. James Miller', email: 'james@edu.org', status: 'absent' },
                { id: 3, name: 'Ms. Elena Rodriguez', email: 'elena@edu.org', status: 'present' },
                { id: 4, name: 'Dr. Michael Thompson', email: 'michael@edu.org', status: 'absent' }
            ];
        }

        // ============================================================
        //  RENDER TABLE
        // ============================================================
        function renderTable() {
            if (!teachers || teachers.length === 0) {
                tbody.innerHTML =
                    '<tr><td colspan="4" class="empty-state">' +
                    '<i class="fas fa-users-slash"></i>No teachers added yet<br>' +
                    '<span style="font-size: 13px; color: #a0aec0;">Add your first teacher below</span>' +
                    '</td></tr>';
                updateStatusBar();
                return;
            }

            let html = '';
            teachers.forEach(function(teacher, index) {
                const isPresent = teacher.status === 'present';
                const statusClass = isPresent ? 'present' : 'absent';
                const statusText = isPresent ? '✅ Present' : '❌ Absent';
                const isPendingDelete = pendingDeleteIndex === index;

                let actionsHtml;
                if (isPendingDelete) {
                    actionsHtml =
                        '<div class="confirm-row">' +
                        '<span>Remove?</span>' +
                        '<button class="btn btn-danger btn-sm confirm-delete-btn" data-index="' + index + '">Yes</button>' +
                        '<button class="btn btn-outline btn-sm cancel-delete-btn" data-index="' + index + '">No</button>' +
                        '</div>';
                } else {
                    actionsHtml =
                        '<div class="action-btns">' +
                        '<button class="toggle-btn" data-index="' + index + '" title="Toggle attendance"><i class="fas fa-exchange-alt"></i></button>' +
                        '<button class="delete-btn" data-index="' + index + '" title="Remove teacher"><i class="fas fa-trash-alt"></i></button>' +
                        '</div>';
                }

                html +=
                    '<tr>' +
                    '<td><div class="teacher-info"><div class="avatar">' + getInitials(teacher.name) + '</div>' +
                    '<span><strong>' + teacher.name + '</strong></span></div></td>' +
                    '<td>' + (teacher.email || '—') + '</td>' +
                    '<td><span class="status-badge ' + statusClass + '">' + statusText + '</span></td>' +
                    '<td>' + actionsHtml + '</td>' +
                    '</tr>';
            });

            tbody.innerHTML = html;
            updateStatusBar();

            document.querySelectorAll('.toggle-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    toggleTeacher(parseInt(this.getAttribute('data-index'), 10));
                });
            });
            document.querySelectorAll('.delete-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    pendingDeleteIndex = parseInt(this.getAttribute('data-index'), 10);
                    renderTable();
                });
            });
            document.querySelectorAll('.confirm-delete-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    deleteTeacher(parseInt(this.getAttribute('data-index'), 10));
                });
            });
            document.querySelectorAll('.cancel-delete-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    pendingDeleteIndex = null;
                    renderTable();
                });
            });
        }

        // ============================================================
        //  CRUD OPERATIONS
        // ============================================================
        async function addTeacher(name, email) {
            const trimmedName = name.trim();
            if (!trimmedName) {
                showToast('Please enter a teacher name', 'error');
                nameInput.focus();
                return;
            }

            const trimmedEmail = email.trim() || null;
            if (trimmedEmail && !validateEmail(trimmedEmail)) {
                showToast('Please enter a valid email address', 'error');
                emailInput.focus();
                return;
            }

            const duplicate = teachers.some(function(t) {
                return t.name.toLowerCase() === trimmedName.toLowerCase() &&
                    (t.email || '').toLowerCase() === (trimmedEmail || '').toLowerCase();
            });
            if (duplicate) {
                showToast('This teacher already exists!', 'error');
                return;
            }

            addBtn.disabled = true;
            addBtnText.textContent = 'Adding...';
            const icon = addBtn.querySelector('i');
            icon.className = 'fas fa-spinner spinner';

            teachers.push({ id: generateId(), name: trimmedName, email: trimmedEmail, status: 'absent' });
            renderTable();
            clearInputs();
            await saveTeachers();
            showToast('✅ "' + trimmedName + '" added', 'success');

            addBtn.disabled = false;
            addBtnText.textContent = 'Add Teacher';
            icon.className = 'fas fa-plus-circle';
        }

        async function toggleTeacher(index) {
            const teacher = teachers[index];
            if (!teacher) return;
            teacher.status = teacher.status === 'present' ? 'absent' : 'present';
            renderTable();
            await saveTeachers();
            showToast('🔄 "' + teacher.name + '" is now ' + teacher.status, 'success');
        }

        async function deleteTeacher(index) {
            const teacher = teachers[index];
            if (!teacher) return;
            teachers.splice(index, 1);
            pendingDeleteIndex = null;
            renderTable();
            await saveTeachers();
            showToast('🗑️ "' + teacher.name + '" removed', 'success');
        }

        async function markAllPresent() {
            if (!teachers.length) {
                showToast('No teachers to mark', 'error');
                return;
            }
            if (teachers.every(function(t) { return t.status === 'present'; })) {
                showToast('All teachers are already present', 'info');
                return;
            }
            teachers.forEach(function(t) { t.status = 'present'; });
            renderTable();
            await saveTeachers();
            showToast('✅ ' + teachers.length + ' teachers marked as present', 'success');
        }

        function clearInputs() {
            nameInput.value = '';
            emailInput.value = '';
            nameInput.focus();
        }

        // ============================================================
        //  EVENT LISTENERS
        // ============================================================
        addBtn.addEventListener('click', function() {
            addTeacher(nameInput.value, emailInput.value);
        });

        nameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.trim()) {
                e.preventDefault();
                emailInput.focus();
            }
        });

        emailInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addBtn.click();
            }
        });

        markAllBtn.addEventListener('click', markAllPresent);

        refreshBtn.addEventListener('click', async function() {
            const found = await loadTeachers();
            if (!found && teachers.length === 0) seedSampleData();
            renderTable();
            showToast('Refreshed', 'info');
        });

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            detectStorage();
            const found = await loadTeachers();
            if (!found) {
                seedSampleData();
                await saveTeachers();
            }
            renderTable();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            // Document already parsed by the time this script ran —
            // DOMContentLoaded would never fire, so run init directly.
            init();
        }
    </script>
</body>
</html>
