<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Meeting Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #f5f7fa; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
  .container { max-width: 700px; width: 100%; background: white; border-radius: 16px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
  h1 { font-size: 22px; color: #1a2332; margin-bottom: 16px; }
  .status-bar { display: flex; gap: 20px; background: #f8fafc; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; color: #2d3748; }
  .status-bar b { color: #1a2332; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f1f4f8; }
  .row:last-child { border-bottom: none; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: #e9edf2; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #2d3748; flex-shrink: 0; }
  .name { font-weight: 600; font-size: 14px; color: #1a2332; }
  .email { font-size: 12px; color: #718096; }
  .info { flex: 1; min-width: 0; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
  .badge.present { background: #c6f6d5; color: #22543d; }
  .badge.absent { background: #fed7d7; color: #9b2c2c; }
  .actions { display: flex; gap: 6px; }
  button { cursor: pointer; border: none; border-radius: 8px; font-size: 13px; padding: 6px 10px; font-weight: 600; }
  .btn-toggle { background: #edf2f7; color: #2d3748; }
  .btn-toggle:hover { background: #e2e8f0; }
  .btn-delete { background: #fed7d7; color: #9b2c2c; }
  .btn-delete:hover { background: #feb2b2; }
  .empty { text-align: center; color: #a0aec0; padding: 30px 0; font-size: 14px; }
  .form-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  input { flex: 1; min-width: 140px; padding: 9px 12px; border: 1px solid #d1d8e0; border-radius: 8px; font-size: 14px; }
  input:focus { outline: none; border-color: #4f8cff; }
  .btn-add { background: #4f8cff; color: white; padding: 9px 18px; border-radius: 8px; white-space: nowrap; }
  .btn-add:hover { background: #3a7ae8; }
  .btn-add:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-text { color: #c53030; font-size: 13px; margin-top: 6px; display: none; }
  .footer-row { margin-top: 16px; }
  .btn-markall { background: #38a169; color: white; padding: 8px 16px; border-radius: 8px; }
  .btn-markall:hover { background: #2f855a; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #38a169; color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); display: none; }
  .toast.show { display: block; }
  .toast.error { background: #e53e3e; }
</style>
</head>
<body>
<div class="container">
  <h1>Teacher meeting tracker</h1>
  <div class="status-bar">
    <div>Total: <b id="totalCount">0</b></div>
    <div>Present: <b id="presentCount">0</b></div>
  </div>
  <div id="list"></div>
  <div class="form-row">
    <input id="nameInput" placeholder="Full name" autocomplete="off">
    <input id="emailInput" placeholder="Email (optional)" autocomplete="off">
    <button class="btn-add" id="addBtn" type="button">Add teacher</button>
  </div>
  <div class="error-text" id="errorText"></div>
  <div class="footer-row">
    <button class="btn-markall" id="markAllBtn" type="button">Mark all present</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var teachers = [];
var STORAGE_KEY = 'teacherTrackerData';

var listEl = document.getElementById('list');
var totalEl = document.getElementById('totalCount');
var presentEl = document.getElementById('presentCount');
var nameInput = document.getElementById('nameInput');
var emailInput = document.getElementById('emailInput');
var addBtn = document.getElementById('addBtn');
var markAllBtn = document.getElementById('markAllBtn');
var errorText = document.getElementById('errorText');
var toast = document.getElementById('toast');
var toastTimer = null;

function showToast(msg, isError) {
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.className = 'toast'; }, 2500);
}

function showError(msg) {
  errorText.textContent = msg;
  errorText.style.display = 'block';
}

function clearError() {
  errorText.style.display = 'none';
}

function initials(name) {
  return name ? name.charAt(0).toUpperCase() : '?';
}

function validEmail(email) {
  if (!email) return true;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(teachers));
  } catch (e) {
    showToast('Could not save to this browser', true);
  }
}

function load() {
  try {
    var data = localStorage.getItem(STORAGE_KEY);
    if (data) {
      teachers = JSON.parse(data);
      return true;
    }
  } catch (e) {}
  return false;
}

function seed() {
  teachers = [
    { id: 1, name: 'Sarah Chen', email: 'sarah@edu.org', status: 'present' },
    { id: 2, name: 'James Miller', email: 'james@edu.org', status: 'absent' },
    { id: 3, name: 'Elena Rodriguez', email: '', status: 'present' }
  ];
}

function render() {
  totalEl.textContent = teachers.length;
  presentEl.textContent = teachers.filter(function (t) { return t.status === 'present'; }).length;

  if (teachers.length === 0) {
    listEl.innerHTML = '<div class="empty">No teachers added yet</div>';
    return;
  }

  var html = '';
  teachers.forEach(function (t, i) {
    var isPresent = t.status === 'present';
    html += '<div class="row">' +
      '<div class="avatar">' + initials(t.name) + '</div>' +
      '<div class="info"><div class="name">' + escapeHtml(t.name) + '</div>' +
      (t.email ? '<div class="email">' + escapeHtml(t.email) + '</div>' : '') + '</div>' +
      '<span class="badge ' + (isPresent ? 'present' : 'absent') + '">' + (isPresent ? 'Present' : 'Absent') + '</span>' +
      '<div class="actions">' +
      '<button class="btn-toggle" data-act="toggle" data-i="' + i + '" type="button">Toggle</button>' +
      '<button class="btn-delete" data-act="delete" data-i="' + i + '" type="button">Remove</button>' +
      '</div></div>';
  });
  listEl.innerHTML = html;

  listEl.querySelectorAll('button[data-act]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var i = parseInt(btn.getAttribute('data-i'), 10);
      var act = btn.getAttribute('data-act');
      if (act === 'toggle') toggleTeacher(i);
      if (act === 'delete') deleteTeacher(i);
    });
  });
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function toggleTeacher(i) {
  teachers[i].status = teachers[i].status === 'present' ? 'absent' : 'present';
  render();
  save();
  showToast(teachers[i].name + ' is now ' + teachers[i].status);
}

function deleteTeacher(i) {
  var name = teachers[i].name;
  if (!confirm('Remove ' + name + ' from the list?')) return;
  teachers.splice(i, 1);
  render();
  save();
  showToast(name + ' removed');
}

function addTeacher() {
  clearError();
  var name = nameInput.value.trim();
  var email = emailInput.value.trim();

  if (!name) {
    showError('Enter a name first');
    nameInput.focus();
    return;
  }
  if (!validEmail(email)) {
    showError('Enter a valid email or leave it blank');
    emailInput.focus();
    return;
  }
  var dup = teachers.some(function (t) {
    return t.name.toLowerCase() === name.toLowerCase();
  });
  if (dup) {
    showError('That teacher is already on the list');
    return;
  }

  teachers.push({ id: Date.now(), name: name, email: email || null, status: 'absent' });
  nameInput.value = '';
  emailInput.value = '';
  nameInput.focus();
  render();
  save();
  showToast(name + ' added');
}

function markAllPresent() {
  if (teachers.length === 0) {
    showToast('No teachers to mark', true);
    return;
  }
  teachers.forEach(function (t) { t.status = 'present'; });
  render();
  save();
  showToast('All teachers marked present');
}

addBtn.addEventListener('click', addTeacher);
markAllBtn.addEventListener('click', markAllPresent);
nameInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); addTeacher(); }
});
emailInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); addTeacher(); }
});

function init() {
  if (!load()) {
    seed();
    save();
  }
  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
