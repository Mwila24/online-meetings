<!-- Quick Attendance Page -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Attendance</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f7fa; font-family: -apple-system, sans-serif; padding: 20px; }
    .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); max-width: 400px; width: 100%; text-align: center; }
    h2 { color: #1a2332; margin-bottom: 8px; }
    p { color: #718096; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; border: 1px solid #d1d8e0; border-radius: 10px; font-size: 16px; margin-bottom: 12px; }
    button { width: 100%; padding: 12px; background: #4f8cff; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:hover { background: #3a7ae8; }
    .success { color: #38a169; }
    .error { color: #e53e3e; }
  </style>
</head>
<body>
  <div class="card">
    <h2>✅ Mark Attendance</h2>
    <p>Enter your email to mark yourself present</p>
    <input type="email" id="emailInput" placeholder="your@email.com">
    <button id="markBtn">Mark Present</button>
    <div id="message" style="margin-top: 12px;"></div>
  </div>
  <script>
    const SUPABASE_URL = 'https://ajmgmnzqgyssatajtpxl.supabase.co';
    const SUPABASE_ANON_KEY = 'your-anon-key';
    
    document.getElementById('markBtn').addEventListener('click', async function() {
      const email = document.getElementById('emailInput').value.trim();
      const message = document.getElementById('message');
      
      if (!email) {
        message.innerHTML = '<span class="error">Please enter your email</span>';
        return;
      }
      
      try {
        // Find teacher by email
        const response = await fetch(SUPABASE_URL + '/rest/v1/teachers?email=eq.' + email, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
          }
        });
        
        const teachers = await response.json();
        
        if (!teachers || teachers.length === 0) {
          message.innerHTML = '<span class="error">Teacher not found. Please contact administrator.</span>';
          return;
        }
        
        const teacher = teachers[0];
        
        // Update status
        await fetch(SUPABASE_URL + '/rest/v1/teachers?id=eq.' + teacher.id, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status: 'present' })
        });
        
        // Log to history
        await fetch(SUPABASE_URL + '/rest/v1/meeting_history', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify([{
            teacher_id: teacher.id,
            status: 'present',
            notes: 'Marked present via QR code',
            meeting_date: new Date().toISOString()
          }])
        });
        
        message.innerHTML = '<span class="success">✅ Attendance marked! Welcome, ' + teacher.name + '!</span>';
        document.getElementById('emailInput').value = '';
        
      } catch (error) {
        message.innerHTML = '<span class="error">Error: ' + error.message + '</span>';
      }
    });
  </script>
</body>
</html>
