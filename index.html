<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Attendance - Google Meet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
    .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 420px; width: 100%; text-align: center; }
    .logo { font-size: 48px; margin-bottom: 12px; }
    h2 { color: #1a2332; font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #718096; font-size: 14px; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; color: #2d3748; margin-bottom: 4px; }
    .input-group input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px; transition: all 0.2s; }
    .input-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
    .input-group input:disabled { background: #f7fafc; cursor: not-allowed; }
    button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .message { margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 500; display: none; }
    .message.show { display: block; }
    .message.success { background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
    .message.error { background: #fed7d7; color: #9b2c2c; border: 1px solid #feb2b2; }
    .message.loading { background: #bee3f8; color: #2a69ac; border: 1px solid #90cdf4; }
    .message.info { background: #fefcbf; color: #744210; border: 1px solid #f6e05e; }
    .spinner { display: inline-block; animation: spin 0.8s linear infinite; margin-right: 8px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .teacher-info { background: #f7fafc; border-radius: 12px; padding: 12px; margin-bottom: 16px; display: none; text-align: left; }
    .teacher-info.show { display: block; }
    .teacher-info .label { font-size: 12px; color: #718096; }
    .teacher-info .name { font-weight: 600; color: #1a2332; font-size: 16px; }
    .teacher-info .status { font-size: 13px; color: #718096; margin-top: 4px; }
    .debug { background: #1a2332; color: #a0aec0; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 12px; margin-top: 12px; display: none; text-align: left; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
    .debug.show { display: block; }
    .toggle-debug { background: #edf2f7; color: #2d3748; border: none; padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 8px; }
    .toggle-debug:hover { background: #e2e8f0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">✅</div>
    <h2>Mark Attendance</h2>
    <p class="subtitle">Enter your email to mark yourself present for the Google Meet</p>
    
    <div class="input-group">
      <label for="emailInput">📧 Email Address</label>
      <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email">
    </div>
    
    <button id="markBtn">✅ Mark Present</button>
    
    <div id="teacherInfo" class="teacher-info">
      <div class="label">👤 Teacher Found</div>
      <div class="name" id="teacherName">Teacher Name</div>
      <div class="status" id="teacherStatus">Status: Absent</div>
    </div>
    
    <div id="message" class="message"></div>
    
    <button class="toggle-debug" id="debugToggle">🔍 Show Debug Info</button>
    <div id="debugInfo" class="debug"></div>
  </div>

  <script>
    // ============================================================
    //  SUPABASE CONFIG
    // ============================================================
    const SUPABASE_URL = 'https://ajmgmnzqgyssatajtpxl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqbWdtbnpxZ3lzc2F0YWp0cHhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTQ5OTcsImV4cCI6MjEwMzY5MDk5N30.Q2qg_3whnSo1sPxx7uQM4oFoEURdQCSWkR96QqlToDE';
    
    // ============================================================
    //  DOM REFS
    // ============================================================
    const emailInput = document.getElementById('emailInput');
    const markBtn = document.getElementById('markBtn');
    const message = document.getElementById('message');
    const teacherInfo = document.getElementById('teacherInfo');
    const teacherName = document.getElementById('teacherName');
    const teacherStatus = document.getElementById('teacherStatus');
    const debugInfo = document.getElementById('debugInfo');
    const debugToggle = document.getElementById('debugToggle');
    let debugMode = false;
    
    // ============================================================
    //  HELPERS
    // ============================================================
    function showMessage(text, type) {
      message.className = 'message show ' + type;
      message.textContent = text;
    }
    
    function hideMessage() {
      message.className = 'message';
    }
    
    function showTeacherInfo(name, status) {
      teacherInfo.classList.add('show');
      teacherName.textContent = name;
      teacherStatus.textContent = 'Status: ' + (status === 'present' ? '✅ Present' : '❌ Absent');
    }
    
    function hideTeacherInfo() {
      teacherInfo.classList.remove('show');
    }
    
    function addDebug(log) {
      if (debugMode) {
        debugInfo.textContent += log + '\n';
        debugInfo.classList.add('show');
      }
    }
    
    function clearDebug() {
      debugInfo.textContent = '';
    }
    
    // ============================================================
    //  API HELPERS
    // ============================================================
    async function supabaseFetch(path, options) {
      const url = SUPABASE_URL + '/rest/v1/' + path;
      const defaultHeaders = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json'
      };
      
      const mergedOptions = Object.assign({}, options);
      mergedOptions.headers = Object.assign({}, defaultHeaders, options ? options.headers : {});
      
      addDebug('📡 Fetching: ' + url);
      addDebug('📡 Method: ' + (mergedOptions.method || 'GET'));
      
      try {
        const response = await fetch(url, mergedOptions);
        addDebug('📡 Status: ' + response.status);
        
        if (!response.ok) {
          const errorText = await response.text();
          addDebug('❌ Error Response: ' + errorText);
          throw new Error('Error ' + response.status + ': ' + errorText);
        }
        const data = await response.text();
        addDebug('📡 Response: ' + data.substring(0, 200) + (data.length > 200 ? '...' : ''));
        return data ? JSON.parse(data) : null;
      } catch (e) {
        addDebug('❌ Exception: ' + e.message);
        console.error('API error:', e);
        throw e;
      }
    }
    
    // ============================================================
    //  FIND TEACHER BY EMAIL - FIXED VERSION
    // ============================================================
    async function findTeacherByEmail(email) {
      addDebug('🔍 Searching for: "' + email + '"');
      
      try {
        // Method 1: Exact match (case insensitive)
        addDebug('📌 Method 1: Exact match');
        const response1 = await supabaseFetch(
          'teachers?select=*&email=ilike.' + encodeURIComponent(email.trim()),
          { method: 'GET' }
        );
        
        if (response1 && response1.length > 0) {
          addDebug('✅ Found by exact email match');
          return response1[0];
        }
        
        // Method 2: Search by name
        addDebug('📌 Method 2: Search by name');
        const response2 = await supabaseFetch(
          'teachers?select=*&name=ilike.' + encodeURIComponent(email.trim()),
          { method: 'GET' }
        );
        
        if (response2 && response2.length > 0) {
          addDebug('✅ Found by name match');
          return response2[0];
        }
        
        // Method 3: Get all teachers and filter manually (fallback)
        addDebug('📌 Method 3: Manual filter on all teachers');
        const allTeachers = await supabaseFetch('teachers?select=*', { method: 'GET' });
        
        if (allTeachers && allTeachers.length > 0) {
          addDebug('📊 Found ' + allTeachers.length + ' total teachers');
          
          // Try case-insensitive match
          const searchEmail = email.trim().toLowerCase();
          const found = allTeachers.find(function(t) {
            const teacherEmail = (t.email || '').toLowerCase();
            const teacherName = (t.name || '').toLowerCase();
            return teacherEmail === searchEmail || 
                   teacherName === searchEmail ||
                   teacherEmail.includes(searchEmail) ||
                   teacherName.includes(searchEmail);
          });
          
          if (found) {
            addDebug('✅ Found by manual filter');
            return found;
          }
        }
        
        addDebug('❌ No teacher found');
        return null;
        
      } catch (e) {
        addDebug('❌ Search error: ' + e.message);
        throw e;
      }
    }
    
    // ============================================================
    //  MARK ATTENDANCE - FIXED VERSION
    // ============================================================
    async function markAttendance(email) {
      hideMessage();
      hideTeacherInfo();
      clearDebug();
      
      if (!email || email.trim() === '') {
        showMessage('Please enter your email address', 'error');
        emailInput.focus();
        return;
      }
      
      // Validate email format
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email.trim())) {
        showMessage('Please enter a valid email address', 'error');
        emailInput.focus();
        return;
      }
      
      // Disable button and show loading
      markBtn.disabled = true;
      markBtn.innerHTML = '<span class="spinner">⏳</span> Checking...';
      showMessage('🔍 Looking up your account...', 'loading');
      
      try {
        // Find teacher by email
        const teacher = await findTeacherByEmail(email.trim());
        
        addDebug('📊 Teacher object: ' + JSON.stringify(teacher, null, 2));
        
        if (!teacher) {
          showMessage('❌ Teacher not found. Please contact your administrator to be added to the system.', 'error');
          markBtn.disabled = false;
          markBtn.innerHTML = '✅ Mark Present';
          return;
        }
        
        // Check if teacher has an ID
        if (!teacher.id) {
          addDebug('❌ Teacher has no ID!');
          showMessage('❌ Error: Teacher record is invalid (missing ID). Please contact administrator.', 'error');
          markBtn.disabled = false;
          markBtn.innerHTML = '✅ Mark Present';
          return;
        }
        
        // Show teacher info
        showTeacherInfo(teacher.name, teacher.status);
        
        // Check if already present
        if (teacher.status === 'present') {
          showMessage('✅ You are already marked as present!', 'success');
          markBtn.disabled = false;
          markBtn.innerHTML = '✅ Already Present';
          return;
        }
        
        // Update status to present
        showMessage('⏳ Marking you as present...', 'loading');
        addDebug('📝 Updating teacher ID: ' + teacher.id + ' to present');
        
        const updateResponse = await supabaseFetch(
          'teachers?id=eq.' + teacher.id,
          {
            method: 'PATCH',
            headers: { 'Prefer': 'return=representation' },
            body: JSON.stringify({ status: 'present' })
          }
        );
        
        addDebug('📊 Update response: ' + JSON.stringify(updateResponse, null, 2));
        
        if (!updateResponse || updateResponse.length === 0) {
          throw new Error('Failed to update status - no response from server');
        }
        
        // Log to meeting history
        try {
          addDebug('📝 Logging to history...');
          await supabaseFetch('meeting_history', {
            method: 'POST',
            headers: { 'Prefer': 'return=representation' },
            body: JSON.stringify([{
              teacher_id: teacher.id,
              status: 'present',
              notes: 'Marked present via QR code / self-attendance',
              meeting_date: new Date().toISOString()
            }])
          });
          addDebug('✅ History logged');
        } catch (historyError) {
          addDebug('⚠️ History error: ' + historyError.message);
          // Continue even if history fails
        }
        
        // Success!
        showMessage('✅ Attendance marked successfully! Welcome, ' + teacher.name + '! 🎉', 'success');
        markBtn.innerHTML = '✅ Marked Present';
        teacherStatus.textContent = 'Status: ✅ Present';
        emailInput.value = '';
        emailInput.disabled = true;
        
        // Re-enable after 5 seconds for next use
        setTimeout(function() {
          markBtn.disabled = false;
          markBtn.innerHTML = '✅ Mark Present';
          emailInput.disabled = false;
          emailInput.focus();
        }, 5000);
        
      } catch (error) {
        console.error('Attendance error:', error);
        addDebug('❌ Error: ' + error.message);
        showMessage('❌ Error: ' + error.message, 'error');
        markBtn.disabled = false;
        markBtn.innerHTML = '✅ Mark Present';
      }
    }
    
    // ============================================================
    //  EVENT LISTENERS
    // ============================================================
    
    // Mark button click
    markBtn.addEventListener('click', function(e) {
      e.preventDefault();
      markAttendance(emailInput.value);
    });
    
    // Enter key support
    emailInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        markBtn.click();
      }
    });
    
    // Debug toggle
    debugToggle.addEventListener('click', function() {
      debugMode = !debugMode;
      if (debugMode) {
        debugInfo.classList.add('show');
        this.textContent = '🔒 Hide Debug Info';
        addDebug('🐛 Debug mode enabled');
        addDebug('📧 Email: ' + emailInput.value);
        addDebug('🔗 Supabase URL: ' + SUPABASE_URL);
      } else {
        debugInfo.classList.remove('show');
        this.textContent = '🔍 Show Debug Info';
      }
    });
    
    // Auto-focus on page load
    emailInput.focus();
    
    // ============================================================
    //  PRE-FILL FOR TESTING - Uncomment to test
    // ============================================================
    // emailInput.value = 'sarah@edu.org';
    
    console.log('✅ QR Attendance System Ready');
    console.log('📧 Enter your email to mark attendance');
    console.log('🔍 Supabase URL:', SUPABASE_URL);
  </script>
</body>
</html>
