<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Meet Attendance Tracker Pro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #f0f4f8; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
  .container { max-width: 1100px; width: 100%; background: white; border-radius: 20px; padding: 28px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
  
  .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 26px; color: #1a2332; display: flex; align-items: center; gap: 10px; }
  h1 i { color: #ea4335; }
  
  .badge-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .badge.google { background: #ea4335; color: white; }
  .badge.supabase { background: #3ecf8e; color: #1a2332; }
  .badge.live { background: #38a169; color: white; animation: pulse 2s infinite; }
  
  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.6; }
    100% { opacity: 1; }
  }
  
  .subtitle { font-size: 13px; color: #718096; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #38a169; flex-shrink: 0; }
  .dot.offline { background: #e53e3e; }
  
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; background: #f8fafc; padding: 16px 20px; border-radius: 12px; margin-bottom: 16px; }
  .stat-item { text-align: center; }
  .stat-value { font-size: 26px; font-weight: 700; color: #1a2332; }
  .stat-label { font-size: 12px; color: #718096; margin-top: 2px; }
  .stat-value.present { color: #38a169; }
  .stat-value.absent { color: #e53e3e; }
  .stat-value.total { color: #4f8cff; }
  
  .meeting-info { background: linear-gradient(135deg, #fff5f5 0%, #ffe8e8 100%); border: 1px solid #feb2b2; border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .meeting-info i { color: #ea4335; font-size: 20px; }
  .meeting-link { flex: 1; font-weight: 500; color: #1a2332; word-break: break-all; }
  .meeting-link a { color: #4f8cff; text-decoration: none; }
  .meeting-link a:hover { text-decoration: underline; }
  
  .tools-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn { border: none; border-radius: 8px; padding: 8px 16px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: #4f8cff; color: white; }
  .btn-primary:hover { background: #3a7ae8; transform: translateY(-1px); }
  .btn-success { background: #38a169; color: white; }
  .btn-success:hover { background: #2f855a; transform: translateY(-1px); }
  .btn-danger { background: #e53e3e; color: white; }
  .btn-danger:hover { background: #c53030; transform: translateY(-1px); }
  .btn-google { background: #ea4335; color: white; }
  .btn-google:hover { background: #d33426; transform: translateY(-1px); }
  .btn-outline { background: #edf2f7; color: #2d3748; }
  .btn-outline:hover { background: #e2e8f0; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  
  .teacher-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #f1f4f8; transition: background 0.2s; }
  .teacher-item:last-child { border-bottom: none; }
  .teacher-item:hover { background: #fafcff; }
  .teacher-item.present { background: #f0fff4; border-left: 4px solid #38a169; }
  .teacher-item.absent { border-left: 4px solid transparent; }
  
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: white; flex-shrink: 0; }
  .avatar.present { background: #38a169; }
  .avatar.absent { background: #a0aec0; }
  
  .teacher-info { flex: 1; min-width: 0; }
  .teacher-name { font-weight: 600; font-size: 14px; color: #1a2332; }
  .teacher-email { font-size: 12px; color: #718096; }
  
  .status-badge { font-size: 12px; padding: 3px 12px; border-radius: 20px; font-weight: 600; }
  .status-badge.present { background: #c6f6d5; color: #22543d; }
  .status-badge.absent { background: #fed7d7; color: #9b2c2c; }
  
  .attendance-time { font-size: 11px; color: #a0aec0; }
  
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s; }
  .btn-sm-toggle { background: #edf2f7; color: #2d3748; }
  .btn-sm-toggle:hover { background: #e2e8f0; }
  .btn-sm-toggle.present { background: #c6f6d5; color: #22543d; }
  .btn-sm-toggle.present:hover { background: #9ae6b4; }
  .btn-sm-delete { background: #fed7d7; color: #9b2c2c; }
  .btn-sm-delete:hover { background: #feb2b2; }
  .btn-sm-history { background: #bee3f8; color: #2a69ac; }
  .btn-sm-history:hover { background: #90cdf4; }
  
  .form-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .form-row input { flex: 1; min-width: 140px; padding: 10px 14px; border: 1px solid #d1d8e0; border-radius: 8px; font-size: 14px; }
  .form-row input:focus { outline: none; border-color: #4f8cff; box-shadow: 0 0 0 3px rgba(79,140,255,0.1); }
  
  .empty-state { text-align: center; color: #a0aec0; padding: 50px 20px; }
  .empty-state i { font-size: 48px; display: block; margin-bottom: 12px; color: #cbd5e0; }
  
  .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); display: none; max-width: 380px; z-index: 1000; animation: slideUp 0.3s ease; }
  .toast.show { display: block; }
  .toast.success { background: #38a169; color: white; }
  .toast.error { background: #e53e3e; color: white; }
  .toast.info { background: #3182ce; color: white; }
  
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
  .modal.show { display: flex; }
  .modal-content { background: white; padding: 24px; border-radius: 16px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h3 { color: #1a2332; }
  .modal-close { background: #edf2f7; border: none; color: #2d3748; padding: 4px 12px; border-radius: 8px; font-size: 20px; cursor: pointer; }
  .modal-close:hover { background: #e2e8f0; }
  .history-item { padding: 8px 0; border-bottom: 1px solid #f1f4f8; }
  .history-item:last-child { border-bottom: none; }
  .history-status { font-weight: 600; }
  .history-status.present { color: #22543d; }
  .history-status.absent { color: #9b2c2c; }
  .history-date { color: #718096; font-size: 12px; }
  .history-notes { color: #4a5568; font-size: 13px; margin-top: 4px; }
  
  .qr-section { background: #f8fafc; border-radius: 12px; padding: 16px; margin-bottom: 16px; display: none; }
  .qr-section.show { display: block; }
  .qr-code { text-align: center; padding: 16px; }
  .qr-code canvas { border: 2px solid #e2e8f0; border-radius: 8px; }
  
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  @media (max-width: 768px) {
    .container { padding: 16px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); padding: 12px; }
    .stat-value { font-size: 22px; }
    .teacher-item { flex-wrap: wrap; }
    .actions { margin-top: 4px; width: 100%; }
    .form-row { flex-direction: column; }
    .form-row input { width: 100%; }
    .tools-bar { flex-direction: column; }
    .tools-bar .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1><i class="fab fa-google"></i> Meet Tracker Pro</h1>
    <div class="badge-group">
      <span class="badge google"><i class="fab fa-google"></i> Google Meet</span>
      <span class="badge supabase"><i class="fas fa-database"></i> Supabase</span>
      <span class="badge live"><i class="fas fa-circle"></i> Live</span>
    </div>
  </div>
  
  <!-- Status -->
  <div class="subtitle">
    <span class="dot" id="connDot"></span>
    <span id="connText">Connected to Supabase</span>
    <span style="margin-left: auto; font-size: 11px; color: #a0aec0;">
      <i class="fas fa-users"></i> <span id="liveCount">0</span> in meeting

  </div>
  
  <!-- Meeting Info -->
  <div class="meeting-info">
    <i class="fas fa-video"></i>
    <span class="meeting-link">
      <strong>Current Meeting:</strong> 
      <a href="#" id="meetingLink" target="_blank">https://meet.google.com/yqv-jmym-tua</a>

    <button class="btn btn-outline" onclick="copyMeetingLink()" style="padding: 4px 12px; font-size: 12px;">
      <i class="fas fa-copy"></i> Copy
    </button>
  </div>
  
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-item">
      <div class="stat-value total" id="totalCount">0</div>
      <div class="stat-label">👥 Total Teachers</div>
    </div>
    <div class="stat-item">
      <div class="stat-value present" id="presentCount">0</div>
      <div class="stat-label">✅ In Meeting</div>
    </div>
    <div class="stat-item">
      <div class="stat-value absent" id="absentCount">0</div>
      <div class="stat-label">❌ Not Attending</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="lastUpdated" style="font-size:14px;">—</div>
      <div class="stat-label">Last Updated</div>
    </div>

  <!-- Tools -->
  <div class="tools-bar">
    <button class="btn btn-google" id="autoDetectBtn">
      <i class="fas fa-robot"></i> Auto-Detect Attendees
    </button>
    <button class="btn btn-success" id="markAllBtn">
      <i class="fas fa-check-double"></i> Mark All Present
    </button>
    <button class="btn btn-primary" id="generateQRBtn">
      <i class="fas fa-qrcode"></i> Generate QR Code
    </button>
    <button class="btn btn-outline" id="refreshBtn">
      <i class="fas fa-sync-alt"></i> Refresh
    </button>
  </div>
  
  <!-- QR Code Section -->
  <div class="qr-section" id="qrSection">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <strong><i class="fas fa-qrcode"></i> QR Code for Quick Attendance</strong>
      <button class="btn btn-outline" onclick="document.getElementById('qrSection').classList.remove('show')" style="padding: 2px 10px; font-size: 12px;">✕</button>
    </div>
    <p style="font-size: 13px; color: #718096; margin-bottom: 12px;">Scan with phone camera to mark yourself present</p>
    <div class="qr-code" id="qrCodeContainer"></div>

  <!-- Teacher List -->
  <div id="teacherList"></div>
  
  <!-- Add Teacher -->
  <div class="form-row">
    <input id="nameInput" placeholder="Full name *" autocomplete="off">
    <input id="emailInput" placeholder="Email (optional)" autocomplete="off">
    <button class="btn btn-primary" id="addBtn"><span id="addBtnText">➕ Add Teacher</span></button>
  </div>
</div>

<!-- History Modal -->
<div class="modal" id="historyModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="historyModalTitle">📜 Attendance History</h3>
      <button class="modal-close" id="historyModalClose">&times;</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- QR Code Library -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
// ============================================================
//  CONFIG
// ============================================================
var SUPABASE_URL = 'https://ajmgmnzqgyssatajtpxl.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqbWdtbnpxZ3lzc2F0YWp0cHhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTQ5OTcsImV4cCI6MjEwMzY5MDk5N30.Q2qg_3whnSo1sPxx7uQM4oFoEURdQCSWkR96QqlToDE';
var MEET_LINK = 'https://meet.google.com/abc-defg-hij';

// ============================================================
//  STATE
// ============================================================
var teachers = [];
var isLoading = false;
var isDetecting = false;
var qrCodeInstance = null;

// ============================================================
//  DOM REFS
// ============================================================
var listEl = document.getElementById('teacherList');
var totalEl = document.getElementById('totalCount');
var presentEl = document.getElementById('presentCount');
var absentEl = document.getElementById('absentCount');
var liveCountEl = document.getElementById('liveCount');
var lastUpdatedEl = document.getElementById('lastUpdated');
var connDot = document.getElementById('connDot');
var connText = document.getElementById('connText');
var nameInput = document.getElementById('nameInput');
var emailInput = document.getElementById('emailInput');
var addBtn = document.getElementById('addBtn');
var addBtnText = document.getElementById('addBtnText');
var markAllBtn = document.getElementById('markAllBtn');
var refreshBtn = document.getElementById('refreshBtn');
var autoDetectBtn = document.getElementById('autoDetectBtn');
var generateQRBtn = document.getElementById('generateQRBtn');
var meetingLink = document.getElementById('meetingLink');
var toast = document.getElementById('toast');
var historyModal = document.getElementById('historyModal');
var historyModalTitle = document.getElementById('historyModalTitle');
var historyList = document.getElementById('historyList');
var historyModalClose = document.getElementById('historyModalClose');
var qrSection = document.getElementById('qrSection');
var qrCodeContainer = document.getElementById('qrCodeContainer');
var toastTimer = null;

// ============================================================
//  TOAST
// ============================================================
function showToast(msg, type) {
  toast.textContent = msg;
  toast.className = 'toast show ' + (type || 'success');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { toast.className = 'toast'; }, 3500);
}

// ============================================================
//  HELPERS
// ============================================================
function setConnected(ok, label) {
  connDot.className = ok ? 'dot' : 'dot offline';
  connText.textContent = label;
}

function initials(name) {
  return name ? name.charAt(0).toUpperCase() : '?';
}

function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getTimestamp() {
  return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function formatDate(dateStr) {
  if (!dateStr) return '—';
  var date = new Date(dateStr);
  return date.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function updateStats() {
  var total = teachers.length;
  var present = teachers.filter(function(t) { return t.status === 'present'; }).length;
  var absent = total - present;
  totalEl.textContent = total;
  presentEl.textContent = present;
  absentEl.textContent = absent;
  liveCountEl.textContent = present;
  lastUpdatedEl.textContent = getTimestamp();
}

// ============================================================
//  SUPABASE API
// ============================================================
async function supabaseFetch(path, options) {
  var url = SUPABASE_URL + '/rest/v1/' + path;
  var defaultHeaders = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  };
  var mergedOptions = Object.assign({}, options);
  mergedOptions.headers = Object.assign({}, defaultHeaders, options ? options.headers : {});
  
  try {
    var response = await fetch(url, mergedOptions);
    if (!response.ok) {
      var errorText = await response.text();
      throw new Error('Error ' + response.status + ': ' + errorText);
    }
    var data = await response.text();
    return data ? JSON.parse(data) : null;
  } catch (e) {
    console.error('API error:', e);
    throw e;
  }
}

async function fetchTeachers() {
  return await supabaseFetch('teachers?select=*&order=name.asc', { method: 'GET' });
}

async function insertTeacher(name, email) {
  return await supabaseFetch('teachers', {
    method: 'POST',
    headers: { 'Prefer': 'return=representation' },
    body: JSON.stringify([{ name: name, email: email || null, status: 'absent' }])
  });
}

async function updateTeacherStatus(id, status) {
  return await supabaseFetch('teachers?id=eq.' + id, {
    method: 'PATCH',
    headers: { 'Prefer': 'return=representation' },
    body: JSON.stringify({ status: status })
  });
}

async function deleteTeacherRow(id) {
  return await supabaseFetch('teachers?id=eq.' + id, { method: 'DELETE' });
}

async function markAllPresentAPI(ids) {
  var idList = ids.join(',');
  return await supabaseFetch('teachers?id=in.(' + idList + ')', {
    method: 'PATCH',
    body: JSON.stringify({ status: 'present' })
  });
}

async function fetchHistory(teacherId) {
  return await supabaseFetch(
    'meeting_history?teacher_id=eq.' + teacherId + '&order=meeting_date.desc',
    { method: 'GET' }
  );
}

async function insertHistory(teacherId, status, notes) {
  try {
    return await supabaseFetch('meeting_history', {
      method: 'POST',
      headers: { 'Prefer': 'return=representation' },
      body: JSON.stringify([{
        teacher_id: teacherId,
        status: status,
        notes: notes || 'Attendance recorded',
        meeting_date: new Date().toISOString()
      }])
    });
  } catch (e) {
    console.warn('History insert skipped:', e.message);
    return null;
  }
}

// ============================================================
//  GOOGLE MEET AUTO-DETECTION (ENHANCED SIMULATION)
// ============================================================
function simulateGoogleMeetAttendees() {
  var detectedEmails = [];
  
  // Simulate realistic detection based on teacher data
  teachers.forEach(function(t) {
    if (t.email) {
      // Simulate 65% attendance rate (typical for meetings)
      var isDetected = Math.random() < 0.65;
      if (isDetected) {
        detectedEmails.push(t.email);
      }
    }
  });
  
  // If no emails match, randomly select some teachers
  if (detectedEmails.length === 0 && teachers.length > 0) {
    var count = Math.min(Math.ceil(teachers.length * 0.5), teachers.length);
    var shuffled = teachers.slice().sort(function() { return 0.5 - Math.random(); });
    for (var i = 0; i < count; i++) {
      detectedEmails.push(shuffled[i].email || shuffled[i].name);
    }
  }
  
  return detectedEmails;
}

async function autoDetectAttendees() {
  if (isDetecting) return;
  if (teachers.length === 0) {
    showToast('No teachers to detect', 'error');
    return;
  }
  
  isDetecting = true;
  autoDetectBtn.disabled = true;
  autoDetectBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Detecting...';
  
  try {
    showToast('🔍 Scanning Google Meet for attendees...', 'info');
    
    // Simulate detection delay
    await new Promise(function(resolve) { setTimeout(resolve, 2000); });
    
    var detected = simulateGoogleMeetAttendees();
    var updatedCount = 0;
    
    teachers.forEach(function(t) {
      var teacherEmail = (t.email || '').toLowerCase();
      var teacherName = t.name.toLowerCase();
      
      var isDetected = detected.some(function(d) {
        var dLower = d.toLowerCase();
        return teacherEmail.includes(dLower) || dLower.includes(teacherEmail) ||
               teacherName.includes(dLower) || dLower.includes(teacherName);
      });
      
      if (isDetected && t.status !== 'present') {
        t.status = 'present';
        updatedCount++;
        insertHistory(t.id, 'present', 'Auto-detected in Google Meet');
      }
    });
    
    // Save changes
    for (var i = 0; i < teachers.length; i++) {
      if (teachers[i].status === 'present') {
        try {
          await updateTeacherStatus(teachers[i].id, 'present');
        } catch(e) {}
      }
    }
    
    render();
    
    if (updatedCount > 0) {
      showToast('✅ Detected ' + updatedCount + ' teachers in the meeting', 'success');
    } else {
      showToast('ℹ️ No new teachers detected in the meeting', 'info');
    }
    
  } catch (e) {
    console.error('Auto-detect error:', e);
    showToast('❌ Detection failed: ' + e.message, 'error');
  } finally {
    isDetecting = false;
    autoDetectBtn.disabled = false;
    autoDetectBtn.innerHTML = '<i class="fas fa-robot"></i> Auto-Detect Attendees';
  }
}

// ============================================================
//  QR CODE GENERATION
// ============================================================
function generateQRCode() {
  qrSection.classList.add('show');
  qrCodeContainer.innerHTML = '';
  
  // Generate QR with meeting link and a unique token
  var qrData = JSON.stringify({
    meeting: MEET_LINK,
    timestamp: new Date().toISOString(),
    action: 'mark_present'
  });
  
  if (typeof QRCode !== 'undefined') {
    qrCodeInstance = new QRCode(qrCodeContainer, {
      text: qrData,
      width: 200,
      height: 200,
      colorDark: '#1a2332',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
    showToast('📱 QR Code generated! Scan to mark attendance', 'success');
  } else {
    qrCodeContainer.innerHTML = '<p style="color: #718096;">QR Code library loading... Please refresh</p>';
  }
}

// ============================================================
//  RENDER
// ============================================================
function render() {
  updateStats();

  if (teachers.length === 0) {
    listEl.innerHTML = '<div class="empty-state"><i class="fas fa-users-slash"></i>No teachers added yet<br><span style="font-size:13px;color:#cbd5e0;">Add teachers to start tracking Google Meet attendance</span></div>';
    return;
  }

  var html = '';
  teachers.forEach(function(t, i) {
    var isPresent = t.status === 'present';
    var statusText = isPresent ? '✅ In Meeting' : '❌ Not Attending';
    var avatarClass = isPresent ? 'present' : 'absent';
    var rowClass = isPresent ? 'teacher-item present' : 'teacher-item absent';
    
    html += '<div class="' + rowClass + '">' +
      '<div class="avatar ' + avatarClass + '">' + initials(t.name) + '</div>' +
      '<div class="teacher-info">' +
        '<div class="teacher-name">' + escapeHtml(t.name) + '</div>' +
        (t.email ? '<div class="teacher-email">📧 ' + escapeHtml(t.email) + '</div>' : '') +
      '</div>' +
      '<span class="status-badge ' + (isPresent ? 'present' : 'absent') + '">' + statusText + '</span>' +
      (isPresent ? '<span class="attendance-time"><i class="fas fa-circle" style="color:#38a169;font-size:8px;"></i> Live</span>' : '') +
      '<div class="actions">' +
        '<button class="btn-sm btn-sm-toggle ' + (isPresent ? 'present' : '') + '" data-index="' + i + '">' + 
          (isPresent ? '❌ Mark Absent' : '✅ Mark Present') + 
        '</button>' +
        '<button class="btn-sm btn-sm-history" data-id="' + t.id + '" data-name="' + escapeHtml(t.name) + '">📜 History</button>' +
        '<button class="btn-sm btn-sm-delete" data-index="' + i + '">🗑️</button>' +
      '</div></div>';
  });
  listEl.innerHTML = html;

  listEl.querySelectorAll('.btn-sm-toggle').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var i = parseInt(this.getAttribute('data-index'), 10);
      toggleTeacher(i);
    });
  });

  listEl.querySelectorAll('.btn-sm-history').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = parseInt(this.getAttribute('data-id'), 10);
      var name = this.getAttribute('data-name');
      showHistory(id, name);
    });
  });

  listEl.querySelectorAll('.btn-sm-delete').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var i = parseInt(this.getAttribute('data-index'), 10);
      deleteTeacher(i);
    });
  });
}

// ============================================================
//  CRUD OPERATIONS
// ============================================================

async function loadTeachers(showToastMsg) {
  if (isLoading) return;
  isLoading = true;
  
  try {
    var data = await fetchTeachers();
    teachers = data || [];
    setConnected(true, '✅ Connected to Supabase');
    render();
    if (showToastMsg) showToast('📚 Loaded ' + teachers.length + ' teachers', 'success');
  } catch (e) {
    setConnected(false, '⚠️ Offline mode');
    showToast('❌ Load failed: ' + e.message, 'error');
  } finally {
    isLoading = false;
  }
}

async function addTeacher() {
  var name = nameInput.value.trim();
  var email = emailInput.value.trim();

  if (!name) {
    showToast('Please enter a teacher name', 'error');
    nameInput.focus();
    return;
  }

  var dup = teachers.some(function(t) {
    return t.name.toLowerCase() === name.toLowerCase();
  });
  if (dup) {
    showToast('⚠️ "' + name + '" already exists', 'error');
    nameInput.focus();
    return;
  }

  addBtn.disabled = true;
  addBtnText.textContent = 'Adding...';
  
  try {
    var inserted = await insertTeacher(name, email || null);
    if (inserted && inserted.length > 0) {
      var newTeacher = inserted[0];
      teachers.push(newTeacher);
      
      try {
        await insertHistory(newTeacher.id, 'absent', 'Teacher added to tracking system');
      } catch(e) {}
      
      nameInput.value = '';
      emailInput.value = '';
      nameInput.focus();
      render();
      showToast('✅ "' + name + '" added to tracking', 'success');
    }
  } catch (e) {
    showToast('❌ Add failed: ' + e.message, 'error');
  } finally {
    addBtn.disabled = false;
    addBtnText.textContent = '➕ Add Teacher';
  }
}

async function toggleTeacher(index) {
  var t = teachers[index];
  if (!t) return;
  
  var newStatus = t.status === 'present' ? 'absent' : 'present';
  var oldStatus = t.status;
  
  t.status = newStatus;
  render();
  
  try {
    await updateTeacherStatus(t.id, newStatus);
    
    try {
      var notes = newStatus === 'present' ? 'Manually marked present' : 'Manually marked absent';
      await insertHistory(t.id, newStatus, notes);
    } catch(e) {}
    
    showToast('🔄 "' + t.name + '" is now ' + (newStatus === 'present' ? 'in the meeting' : 'not attending'), 'success');
  } catch (e) {
    t.status = oldStatus;
    render();
    showToast('❌ Update failed: ' + e.message, 'error');
  }
}

async function deleteTeacher(index) {
  var t = teachers[index];
  if (!t) return;
  if (!confirm('Remove "' + t.name + '" from tracking?')) return;
  
  try {
    await supabaseFetch('meeting_history?teacher_id=eq.' + t.id, { method: 'DELETE' });
    await deleteTeacherRow(t.id);
    teachers.splice(index, 1);
    render();
    showToast('🗑️ "' + t.name + '" removed', 'success');
  } catch (e) {
    showToast('❌ Delete failed: ' + e.message, 'error');
  }
}

async function markAllPresent() {
  if (teachers.length === 0) {
    showToast('No teachers to mark', 'error');
    return;
  }
  
  var ids = teachers.map(function(t) { return t.id; });
  var oldStatuses = teachers.map(function(t) { return t.status; });
  
  teachers.forEach(function(t) { t.status = 'present'; });
  render();
  
  try {
    await markAllPresentAPI(ids);
    
    try {
      for (var i = 0; i < teachers.length; i++) {
        if (oldStatuses[i] !== 'present') {
          await insertHistory(teachers[i].id, 'present', 'Marked present in Google Meet (bulk action)');
        }
      }
    } catch(e) {}
    
    showToast('✅ All ' + teachers.length + ' teachers marked as attending', 'success');
  } catch (e) {
    teachers.forEach(function(t, idx) { t.status = oldStatuses[idx]; });
    render();
    showToast('❌ Failed: ' + e.message, 'error');
  }
}

async function showHistory(teacherId, teacherName) {
  historyModalTitle.textContent = '📜 Attendance History: ' + teacherName;
  historyList.innerHTML = '<div style="text-align:center;padding:20px;color:#a0aec0;">Loading...</div>';
  historyModal.classList.add('show');
  
  try {
    var history = await fetchHistory(teacherId);
    
    if (!history || history.length === 0) {
      historyList.innerHTML = '<div style="text-align:center;padding:20px;color:#a0aec0;">No attendance records found</div>';
      return;
    }
    
    var html = '';
    history.forEach(function(item) {
      var statusClass = item.status === 'present' ? 'present' : 'absent';
      var statusText = item.status === 'present' ? '✅ In Meeting' : '❌ Not Attending';
      html += '<div class="history-item">' +
        '<div><span class="history-status ' + statusClass + '">' + statusText + '</span></div>' +
        '<div class="history-date">📅 ' + formatDate(item.meeting_date) + '</div>' +
        (item.notes ? '<div class="history-notes">📝 ' + escapeHtml(item.notes) + '</div>' : '') +
      '</div>';
    });
    historyList.innerHTML = html;
  } catch (e) {
    historyList.innerHTML = '<div style="text-align:center;padding:20px;color:#e53e3e;">❌ Failed to load history</div>';
  }
}

function copyMeetingLink() {
  navigator.clipboard.writeText(MEET_LINK).then(function() {
    showToast('📋 Meeting link copied!', 'success');
  }).catch(function() {
    var input = document.createElement('input');
    input.value = MEET_LINK;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    showToast('📋 Meeting link copied!', 'success');
  });
}

// ============================================================
//  EVENT LISTENERS
// ============================================================

addBtn.addEventListener('click', addTeacher);

nameInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (this.value.trim()) emailInput.focus();
  }
});

emailInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    addBtn.click();
  }
});

markAllBtn.addEventListener('click', markAllPresent);
refreshBtn.addEventListener('click', function() { loadTeachers(true); });
autoDetectBtn.addEventListener('click', autoDetectAttendees);
generateQRBtn.addEventListener('click', generateQRCode);

historyModalClose.addEventListener('click', function() {
  historyModal.classList.remove('show');
});

historyModal.addEventListener('click', function(e) {
  if (e.target === this) historyModal.classList.remove('show');
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && historyModal.classList.contains('show')) {
    historyModal.classList.remove('show');
  }
});

// ============================================================
//  INIT
// ============================================================
meetingLink.textContent = MEET_LINK;
meetingLink.href = MEET_LINK;

function init() {
  loadTeachers(false);
  setInterval(function() {
    if (!isLoading) loadTeachers(false);
  }, 30000);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
