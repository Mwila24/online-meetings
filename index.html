<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Meeting Tracker</title>
    <!-- Supabase JS client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app-card {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 28px 24px 32px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0a2540;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        h1 i {
            color: #3b82f6;
        }
        .subtitle {
            color: #5a6f88;
            font-size: 14px;
            margin-bottom: 24px;
            padding: 10px 16px;
            background: #f7faff;
            border-radius: 12px;
            border-left: 4px solid #3b82f6;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 24px;
        }
        .badge-github {
            background: #0a2540;
            color: white;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge-github i {
            color: #8cb4f8;
        }
        .status-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 12px 18px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
            gap: 10px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #1a365d;
        }
        .status-item i {
            color: #3b82f6;
            font-size: 15px;
        }
        .status-item .count {
            font-weight: 700;
            background: #dbeafe;
            padding: 0 10px;
            border-radius: 30px;
            color: #1e4a7a;
        }
        .btn-primary {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #cbd5e1;
            color: #1a365d;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            background: white;
            margin-top: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 500px;
        }
        th {
            text-align: left;
            padding: 14px 16px;
            background: #f8fafc;
            color: #1a365d;
            font-weight: 600;
            border-bottom: 1px solid #e2e8f0;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #1a365d;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: #fafcff;
        }
        .teacher-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #dbeafe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #1e4a7a;
            font-size: 14px;
        }
        .flex-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge-status {
            background: #dcfce7;
            color: #166534;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }
        .badge-status.absent {
            background: #fee2e2;
            color: #991b1b;
        }
        .action-icons {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .action-icons button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            color: #64748b;
            transition: 0.2s;
            padding: 4px 6px;
            border-radius: 8px;
        }
        .action-icons button:hover {
            background: #f1f5f9;
            color: #1a365d;
        }
        .action-icons .delete-btn:hover {
            color: #dc2626;
            background: #fef2f2;
        }
        .footer-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            gap: 14px;
        }
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            flex: 1;
        }
        .input-group input {
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid #d1d9e6;
            background: white;
            font-size: 14px;
            flex: 1;
            min-width: 140px;
            transition: 0.2s;
        }
        .input-group input:focus {
            outline: 2px solid #3b82f6;
            border-color: transparent;
        }
        .input-group input:disabled {
            background: #f1f5f9;
            cursor: not-allowed;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }
        .empty-state i {
            font-size: 32px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .deploy-note {
            margin-top: 20px;
            background: #f8fafc;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 13px;
            color: #1a365d;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            border: 1px solid #e2e8f0;
        }
        .deploy-note i {
            color: #3b82f6;
        }
        .deploy-note .tag {
            background: #0a2540;
            color: white;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0a2540;
            color: white;
            padding: 14px 22px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            max-width: 380px;
        }
        .toast.show {
            display: flex;
            animation: slideUp 0.3s ease;
        }
        .toast.success {
            background: #065f46;
        }
        .toast.error {
            background: #991b1b;
        }
        .toast i {
            font-size: 18px;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .spinner {
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 640px) {
            .app-card { padding: 16px; }
            .status-bar { flex-direction: column; align-items: stretch; gap: 6px; }
            .footer-actions { flex-direction: column; align-items: stretch; }
            .input-group input { min-width: 100px; }
            .badge-github { font-size: 11px; }
        }
    </style>
</head>
<body>

<div class="app-card" id="app">
    <div style="display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; gap: 10px;">
        <h1>
            <i class="fas fa-chalkboard-teacher"></i> 
            Meeting Tracker
        </h1>
        <div class="badge-github">
            <i class="fab fa-github"></i> teacher-tracker
        </div>
    </div>
    <div class="subtitle">
        <span><i class="fas fa-database"></i> Supabase backend</span>
        <span><i class="fas fa-cloud"></i> Hosted on Vercel</span>
        <span><i class="fas fa-circle" style="color: #22c55e; font-size: 10px;"></i> <span id="connectionStatus">Ready</span></span>
    </div>

    <div class="status-bar">
        <div class="status-item"><i class="fas fa-users"></i> Teachers <span class="count" id="teacherCount">0</span></div>
        <div class="status-item"><i class="fas fa-video"></i> Present <span class="count" id="attendingCount">0</span></div>
        <div class="status-item"><i class="fas fa-clock"></i> <span id="lastUpdated">just now</span></div>
        <button class="btn-outline" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Teacher</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th style="text-align: center; width: 100px;">Actions</th>
                </tr>
            </thead>
            <tbody id="teacherTableBody">
                <tr><td colspan="4" class="empty-state"><i class="fas fa-users-slash"></i><br>No teachers yet. Add one below.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer-actions">
        <div class="input-group">
            <input type="text" id="teacherNameInput" placeholder="Full name *" />
            <input type="email" id="teacherEmailInput" placeholder="Email (optional)" />
            <button class="btn-primary" id="addTeacherBtn">
                <i class="fas fa-plus-circle"></i> 
                <span id="addBtnText">Add</span>
            </button>
        </div>
        <button class="btn-outline" id="markAllPresentBtn"><i class="fas fa-check-double"></i> All present</button>
    </div>

    <div class="deploy-note">
        <i class="fas fa-code-branch"></i> GitHub: <span class="tag">teacher-tracker</span>
        <i class="fas fa-arrow-right"></i>
        <i class="fas fa-globe"></i> Vercel: <span class="tag">teacher-tracker.vercel.app</span>
        <span style="margin-left: auto; background: #dbeafe; color: #1e4a7a; padding: 2px 12px; border-radius: 30px; font-size: 12px;">
            <i class="fas fa-check-circle"></i> Live
        </span>
    </div>
</div>

<div id="toast" class="toast">
    <i id="toastIcon" class="fas fa-check-circle"></i>
    <span id="toastMessage">Success!</span>
</div>

<script>
    // ============================================================
    //  SUPABASE CONFIG - REPLACE WITH YOUR CREDENTIALS
    // ============================================================
    const SUPABASE_URL = 'https://your-project.supabase.co';
    const SUPABASE_ANON_KEY = 'your-anon-key-here';

    // ============================================================
    //  STATE
    // ============================================================
    let teachers = [];
    let supabase = null;
    let useLocalFallback = false;
    let isAdding = false;

    // ============================================================
    //  DOM REFS
    // ============================================================
    const tbody = document.getElementById('teacherTableBody');
    const teacherCount = document.getElementById('teacherCount');
    const attendingCount = document.getElementById('attendingCount');
    const lastUpdated = document.getElementById('lastUpdated');
    const connectionStatus = document.getElementById('connectionStatus');
    const nameInput = document.getElementById('teacherNameInput');
    const emailInput = document.getElementById('teacherEmailInput');
    const addBtn = document.getElementById('addTeacherBtn');
    const addBtnText = document.getElementById('addBtnText');
    const refreshBtn = document.getElementById('refreshBtn');
    const markAllPresentBtn = document.getElementById('markAllPresentBtn');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');
    const toastIcon = document.getElementById('toastIcon');

    // ============================================================
    //  INITIALIZE SUPABASE
    // ============================================================
    function initSupabase() {
        try {
            if (typeof window.supabase !== 'undefined') {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                if (SUPABASE_URL.includes('your-project')) {
                    useLocalFallback = true;
                    connectionStatus.textContent = '⚡ Local Mode';
                    connectionStatus.style.color = '#f59e0b';
                    showToast('Using local storage (configure Supabase for cloud sync)', 'info');
                } else {
                    connectionStatus.textContent = '✅ Connected';
                    connectionStatus.style.color = '#22c55e';
                }
            } else {
                useLocalFallback = true;
                connectionStatus.textContent = '⚡ Local Mode';
                connectionStatus.style.color = '#f59e0b';
                console.warn('Supabase library not loaded, using local fallback');
            }
        } catch (e) {
            useLocalFallback = true;
            connectionStatus.textContent = '⚡ Local Mode';
            connectionStatus.style.color = '#f59e0b';
            console.warn('Supabase init error, using local fallback:', e);
        }
    }

    // ============================================================
    //  TOAST NOTIFICATIONS
    // ============================================================
    let toastTimeout;

    function showToast(message, type = 'success') {
        toast.className = 'toast';
        toast.classList.add(type);
        toastMessage.textContent = message;
        
        if (type === 'success') {
            toastIcon.className = 'fas fa-check-circle';
        } else if (type === 'error') {
            toastIcon.className = 'fas fa-exclamation-circle';
        } else {
            toastIcon.className = 'fas fa-info-circle';
        }
        
        toast.classList.add('show');
        
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // ============================================================
    //  HELPERS
    // ============================================================
    function formatTime() {
        return new Date().toLocaleTimeString('en-US', { 
            hour: '2-digit', 
            minute: '2-digit',
            second: '2-digit'
        });
    }

    function updateStatusBar() {
        const total = teachers.length;
        const attending = teachers.filter(t => t.status === 'present').length;
        teacherCount.textContent = total;
        attendingCount.textContent = attending;
        lastUpdated.textContent = formatTime();
    }

    function validateEmail(email) {
        if (!email) return true;
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function getInitial(name) {
        return name ? name.charAt(0).toUpperCase() : '?';
    }

    function saveLocal() {
        localStorage.setItem('teacherTrackerData', JSON.stringify(teachers));
    }

    function loadLocal() {
        const stored = localStorage.getItem('teacherTrackerData');
        if (stored) {
            try {
                teachers = JSON.parse(stored);
            } catch(e) {
                teachers = [];
            }
        } else {
            // Seed with sample data
            teachers = [
                { id: 1, name: 'Dr. Sarah Chen', email: 'sarah@edu.org', status: 'present' },
                { id: 2, name: 'Prof. James Miller', email: 'james@edu.org', status: 'absent' },
                { id: 3, name: 'Ms. Elena Rodriguez', email: 'elena@edu.org', status: 'present' },
            ];
            saveLocal();
        }
    }

    // ============================================================
    //  RENDER TABLE
    // ============================================================
    function renderTable() {
        if (!teachers || teachers.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="empty-state">
                        <i class="fas fa-users-slash"></i>
                        <br>No teachers yet. Add one below.
                    </td>
                </tr>
            `;
            updateStatusBar();
            return;
        }

        let html = '';
        teachers.forEach((teacher, index) => {
            const isPresent = teacher.status === 'present';
            const statusClass = isPresent ? 'badge-status' : 'badge-status absent';
            const statusLabel = isPresent ? '✅ Present' : '❌ Absent';
            const initial = getInitial(teacher.name);
            
            html += `
                <tr>
                    <td>
                        <div class="flex-row">
                            <div class="teacher-avatar">${initial}</div>
                            <span><strong>${teacher.name || 'Unnamed'}</strong></span>
                        </div>
                    </td>
                    <td>${teacher.email || '—'}</td>
                    <td><span class="${statusClass}">${statusLabel}</span></td>
                    <td>
                        <div class="action-icons">
                            <button class="toggle-btn" data-index="${index}" title="Toggle attendance">
                                <i class="fas fa-exchange-alt"></i>
                            </button>
                            <button class="delete-btn" data-index="${index}" title="Remove teacher">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });
        
        tbody.innerHTML = html;
        updateStatusBar();

        // Attach event listeners
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.dataset.index);
                toggleTeacherStatus(idx);
            });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const idx = parseInt(btn.dataset.index);
                deleteTeacher(idx);
            });
        });
    }

    // ============================================================
    //  CRUD OPERATIONS
    // ============================================================

    // LOAD TEACHERS
    async function loadTeachers() {
        if (useLocalFallback) {
            loadLocal();
            renderTable();
            return;
        }

        try {
            const { data, error } = await supabase
                .from('teachers')
                .select('*')
                .order('name');
            
            if (error) throw error;
            
            if (data) {
                teachers = data;
                renderTable();
                connectionStatus.textContent = '✅ Connected';
                connectionStatus.style.color = '#22c55e';
            }
        } catch (err) {
            console.error('Supabase load error:', err);
            useLocalFallback = true;
            connectionStatus.textContent = '⚡ Local Mode';
            connectionStatus.style.color = '#f59e0b';
            loadLocal();
            renderTable();
            showToast('Using local storage - Supabase connection failed', 'error');
        }
    }

    // ADD TEACHER
    async function addTeacher(name, email) {
        // Validate
        const trimmedName = name.trim();
        if (!trimmedName) {
            showToast('Please enter a teacher name', 'error');
            nameInput.focus();
            return false;
        }

        const trimmedEmail = email.trim() || null;
        if (trimmedEmail && !validateEmail(trimmedEmail)) {
            showToast('Please enter a valid email address', 'error');
            emailInput.focus();
            return false;
        }

        // Check duplicate
        const duplicate = teachers.some(t => 
            t.name.toLowerCase() === trimmedName.toLowerCase() &&
            (t.email || '').toLowerCase() === (trimmedEmail || '').toLowerCase()
        );
        if (duplicate) {
            showToast('This teacher already exists', 'error');
            return false;
        }

        const newTeacher = { 
            name: trimmedName, 
            email: trimmedEmail, 
            status: 'absent' 
        };

        // Show loading state
        isAdding = true;
        addBtn.disabled = true;
        addBtnText.textContent = 'Adding...';
        addBtn.querySelector('i').className = 'fas fa-spinner spinner';

        try {
            if (useLocalFallback) {
                // Generate a simple ID
                newTeacher.id = Date.now();
                teachers.push(newTeacher);
                saveLocal();
                renderTable();
                showToast(`✅ "${trimmedName}" added successfully`, 'success');
                clearInputs();
                return true;
            }

            // Try Supabase
            const { data, error } = await supabase
                .from('teachers')
                .insert([newTeacher])
                .select();
            
            if (error) throw error;
            
            if (data && data.length) {
                teachers.push(data[0]);
                renderTable();
                showToast(`✅ "${trimmedName}" added successfully`, 'success');
                clearInputs();
                return true;
            } else {
                throw new Error('No data returned');
            }
        } catch (err) {
            console.error('Add error:', err);
            
            // Fallback to local
            if (!useLocalFallback) {
                useLocalFallback = true;
                connectionStatus.textContent = '⚡ Local Mode';
                connectionStatus.style.color = '#f59e0b';
                newTeacher.id = Date.now();
                teachers.push(newTeacher);
                saveLocal();
                renderTable();
                showToast(`⚠️ Added to local storage`, 'error');
                clearInputs();
                return true;
            } else {
                showToast(`❌ Failed to add: ${err.message}`, 'error');
                return false;
            }
        } finally {
            isAdding = false;
            addBtn.disabled = false;
            addBtnText.textContent = 'Add';
            addBtn.querySelector('i').className = 'fas fa-plus-circle';
        }
    }

    function clearInputs() {
        nameInput.value = '';
        emailInput.value = '';
        nameInput.focus();
    }

    // TOGGLE TEACHER STATUS
    async function toggleTeacherStatus(index) {
        const teacher = teachers[index];
        if (!teacher) return;
        
        const newStatus = teacher.status === 'present' ? 'absent' : 'present';
        const oldStatus = teacher.status;

        if (useLocalFallback) {
            teacher.status = newStatus;
            saveLocal();
            renderTable();
            showToast(`🔄 "${teacher.name}" is now ${newStatus}`, 'success');
            return;
        }

        try {
            const { error } = await supabase
                .from('teachers')
                .update({ status: newStatus })
                .eq('id', teacher.id);
            
            if (error) throw error;
            
            teacher.status = newStatus;
            renderTable();
            showToast(`🔄 "${teacher.name}" is now ${newStatus}`, 'success');
        } catch (err) {
            console.error('Toggle error:', err);
            // Fallback
            teacher.status = newStatus;
            saveLocal();
            renderTable();
            useLocalFallback = true;
            connectionStatus.textContent = '⚡ Local Mode';
            connectionStatus.style.color = '#f59e0b';
            showToast(`⚠️ Updated locally`, 'error');
        }
    }

    // DELETE TEACHER
    async function deleteTeacher(index) {
        const teacher = teachers[index];
        if (!teacher) return;
        
        if (!confirm(`Remove "${teacher.name}" from the list?`)) return;

        if (useLocalFallback) {
            teachers.splice(index, 1);
            saveLocal();
            renderTable();
            showToast(`🗑️ "${teacher.name}" removed`, 'success');
            return;
        }

        try {
            const { error } = await supabase
                .from('teachers')
                .delete()
                .eq('id', teacher.id);
            
            if (error) throw error;
            
            teachers.splice(index, 1);
            renderTable();
            showToast(`🗑️ "${teacher.name}" removed`, 'success');
        } catch (err) {
            console.error('Delete error:', err);
            teachers.splice(index, 1);
            saveLocal();
            renderTable();
            useLocalFallback = true;
            connectionStatus.textContent = '⚡ Local Mode';
            connectionStatus.style.color = '#f59e0b';
            showToast(`⚠️ Removed locally`, 'error');
        }
    }

    // MARK ALL PRESENT
    async function markAllPresent() {
        if (!teachers || teachers.length === 0) {
            showToast('No teachers to mark', 'error');
            return;
        }

        const allPresent = teachers.every(t => t.status === 'present');
        if (allPresent) {
            showToast('All teachers are already present', 'info');
            return;
        }

        if (useLocalFallback) {
            teachers.forEach(t => t.status = 'present');
            saveLocal();
            renderTable();
            showToast(`✅ ${teachers.length} teachers marked as present`, 'success');
            return;
        }

        try {
            const ids = teachers.map(t => t.id).filter(id => id);
            if (ids.length === 0) throw new Error('No valid IDs');
            
            const { error } = await supabase
                .from('teachers')
                .update({ status: 'present' })
                .in('id', ids);
            
            if (error) throw error;
            
            teachers.forEach(t => t.status = 'present');
            renderTable();
            showToast(`✅ ${teachers.length} teachers marked as present`, 'success');
        } catch (err) {
            console.error('Mark all error:', err);
            teachers.forEach(t => t.status = 'present');
            saveLocal();
            renderTable();
            useLocalFallback = true;
            connectionStatus.textContent = '⚡ Local Mode';
            connectionStatus.style.color = '#f59e0b';
            showToast(`⚠️ Marked locally`, 'error');
        }
    }

    // ============================================================
    //  EVENT LISTENERS
    // ============================================================

    // Add button
    addBtn.addEventListener('click', async () => {
        await addTeacher(nameInput.value, emailInput.value);
    });

    // Enter key support
    nameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (nameInput.value.trim()) {
                emailInput.focus();
            }
        }
    });

    emailInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            addBtn.click();
        }
    });

    // Refresh
    refreshBtn.addEventListener('click', () => {
        loadTeachers();
        showToast('🔄 Data refreshed', 'success');
    });

    // Mark all present
    markAllPresentBtn.addEventListener('click', markAllPresent);

    // ============================================================
    //  INITIALIZATION
    // ============================================================
    
    function init() {
        initSupabase();
        loadTeachers();
        console.log('📚 Teacher Tracker initialized');
        console.log('Mode:', useLocalFallback ? 'Local Storage' : 'Supabase');
        console.log('Teachers:', teachers.length);
    }

    // Start the app
    init();

    // Auto-refresh every 30 seconds if connected to Supabase
    setInterval(() => {
        if (!useLocalFallback) {
            loadTeachers();
        }
    }, 30000);

</script>
</body>
</html>
